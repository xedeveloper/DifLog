name: Build and Release DifLog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build Binaries
        env:
          BINARY_NAME: DifLog
        run: |
          mkdir -p dist

          echo "Building binary for Linux"
          GOOS=linux GOARCH=amd64 go build -o dist/${BINARY_NAME}-linux-amd-64 .

          echo "Building binary for MacOS darwin"
          GOOS=darwin GOARCH=amd64 go build -o dist/${BINARY_NAME}-darwin-amd-64 .

          echo "Building binary for MacOS arm"
          GOOS=darwin GOARCH=arm64 go build -o dist/${BINARY_NAME}-darwin-arm-64 .

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prod-${{ github.ref_name }}
          name: DifLog ${{ github.ref_name }}
          body: |
            What's changed
            --- 
            -
          draft: true
          prerelease: true
          files: |
            dist/*
